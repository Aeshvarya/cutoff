# The deployed link has to work when a judge clicks it, not when we last did.
name: keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          url="${{ vars.CUTOFF_URL }}"
          if [ -z "$url" ]; then echo "CUTOFF_URL not set yet; nothing to warm."; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url/api/health")
          echo "$url/api/health -> $code"
          [ "$code" = "200" ]
